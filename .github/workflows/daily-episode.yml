# Makes an episode every other morning, covering the two match days since the
# last one, and publishes it to Supabase, where the website reads it.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN    from `claude setup-token`; model calls run on the Claude subscription
#   RAPIDAPI_KEY, TAVILY_API_KEY, ELEVENLABS_API_KEY
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#
# The schedule fires every morning. A scheduled run first checks Supabase and
# stops if the latest episode is less than EPISODE_DAYS days older than
# yesterday, so episodes come out every EPISODE_DAYS days (a cron like */2
# would run two days in a row across the end of a month). GitHub sometimes
# skips or drops scheduled runs, so there are backup times later in the
# morning; a failed or skipped earlier run gets another go.
#
# Before any model call, the check job also makes sure ElevenLabs has enough
# credits left for an episode's audio; otherwise a run would spend the Claude
# subscription on a script and then fail at the produce step. Reading the
# balance needs the ElevenLabs key to have the user_read permission.
#
# Run it by hand from the Actions tab (optionally for another date). A manual run
# always makes the episode, re-publishing the date if it's already there. The
# date is the last match day the episode covers.
#
# The run folder (data/runs/<date>/) isn't uploaded as an artifact: the repo is
# public, and the folder holds raw API data and the full text of fetched
# articles. Run the pipeline locally to look at one.

name: Episode

on:
  schedule:
    # 06:30 UTC: late matches in the Americas are over, and it's morning in Europe.
    - cron: "30 6 * * *"
    # Backups, in case GitHub skips the first one or it fails.
    - cron: "15 8 * * *"
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Last match day, YYYY-MM-DD (default: yesterday, UTC)"
        required: false

concurrency:
  group: daily-episode
  cancel-in-progress: false

env:
  # Days between episodes. The pipeline reads it too: one episode covers this many match days.
  EPISODE_DAYS: "2"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.day.outputs.date }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - name: Pick the date
        id: day
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          d="${DATE_INPUT:-$(date -u -d yesterday +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "not a YYYY-MM-DD date: $d"; exit 1; }
          echo "date=$d" >> "$GITHUB_OUTPUT"

      - name: Check whether an episode is due
        id: published
        if: github.event_name == 'schedule'
        env:
          DAY: ${{ steps.day.outputs.date }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # If Supabase can't be reached, make the episode anyway: a missed episode is worse.
          rows=$(curl -fsS --retry 3 "${SUPABASE_URL%/}/rest/v1/episodes?select=date&order=date.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") \
            || { echo "::warning::couldn't check Supabase; making the episode anyway"; rows="[]"; }
          latest=$(jq -r '.[0].date // empty' <<<"$rows" 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "no episode found; making $DAY"
            exit 0
          fi
          gap=$(( ($(date -u -d "$DAY" +%s) - $(date -u -d "$latest" +%s)) / 86400 ))
          if [ "$gap" -lt "$EPISODE_DAYS" ]; then
            echo "latest episode is $latest, $gap day(s) before $DAY; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest episode is $latest; making $DAY"
          fi

      - name: Check ElevenLabs credits
        if: steps.published.outputs.published != 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # An episode is about 8,000 TTS characters, plus re-rolled lines.
          MIN_CREDITS: "12000"
        run: |
          res=$(curl -sS --retry 3 https://api.elevenlabs.io/v1/user/subscription -H "xi-api-key: $ELEVENLABS_API_KEY") || res="{}"
          used=$(jq -r '.character_count // empty' <<<"$res" 2>/dev/null || true)
          limit=$(jq -r '.character_limit // empty' <<<"$res" 2>/dev/null || true)
          if [ -z "$used" ] || [ -z "$limit" ]; then
            echo "::warning::couldn't read the ElevenLabs balance (give the key the user_read permission): $(head -c 300 <<<"$res")"
            exit 0
          fi
          left=$((limit - used))
          reset=$(jq -r '.next_character_count_reset_unix // empty' <<<"$res")
          echo "ElevenLabs: $left of $limit credits left${reset:+, resets $(date -u -d "@$reset" +%F)}"
          if [ "$left" -lt "$MIN_CREDITS" ]; then
            echo "::error::only $left ElevenLabs credits left, an episode needs about $MIN_CREDITS; stopping before any model call"
            exit 1
          fi

  episode:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg and Claude Code
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          npm install -g @anthropic-ai/claude-code@2.1.314
          claude --version

      - name: Make and publish the episode
        run: >
          uv run python scripts/run_step.py
          discover validate plan write review produce publish
          --date ${{ needs.check.outputs.date }}
