[project]
name = "atp-pipeline"
version = "0.1.0"
description = "Tennis Daily podcast generation pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.27",
    "openai>=3.40.0",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atp_pipeline"]
